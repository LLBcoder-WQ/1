services:
  shop:
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "${SHOP_BIND_ADDRESS:-127.0.0.1}:${SHOP_PORT:-8000}:8000"
    environment:
      SHOP_ENVIRONMENT: production
      SHOP_SECRET_KEY: ${SHOP_SECRET_KEY:?Set SHOP_SECRET_KEY in .env}
      SHOP_DATABASE_URL: sqlite:////data/shop.db
    volumes:
      - shop_data:/data
    security_opt:
      - no-new-privileges:true

volumes:
  shop_data:
